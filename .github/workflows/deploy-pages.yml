name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # zero dependencies — no install step, the built-in runner does it all
      - run: node --test

  deploy:
    # GitHub Pages serves the gh-pages branch (auto-enabled when that branch
    # was first created), so publishing is pointing gh-pages at tested main.
    # The default workflow token cannot use actions/deploy-pages here: site
    # creation via the API needs admin rights it never gets.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
